name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Test suite
        run: bash tests/run.sh
      - name: Manifests are valid and consistent
        run: |
          python3 - <<'PY'
          import glob, json
          files = [".claude-plugin/plugin.json", ".claude-plugin/marketplace.json", ".codex-plugin/plugin.json",
                   ".agents/plugins/marketplace.json", "gemini-extension.json", "plugin.json", "hooks/claude-hooks.json"]
          data = {f: json.load(open(f)) for f in files}
          versions = {data[f]["version"] for f in (".claude-plugin/plugin.json", ".codex-plugin/plugin.json", "gemini-extension.json", "plugin.json")}
          assert len(versions) == 1, f"version mismatch across manifests: {versions}"
          licenses = {data[f]["license"] for f in (".claude-plugin/plugin.json", ".codex-plugin/plugin.json", "plugin.json")}
          assert licenses == {"Apache-2.0"}, f"license mismatch across manifests: {licenses}"
          assert "Apache License" in open("LICENSE").read() and "Version 2.0" in open("LICENSE").read(), "LICENSE is not Apache 2.0"
          assert "Wesley Rafael Fonseca" in open("NOTICE").read(), "NOTICE file is missing author attribution"
          skills = sorted(p.split("/")[1] for p in glob.glob("skills/*/SKILL.md"))
          commands = sorted(p.split("/")[-1][:-5] for p in glob.glob("commands/git-parity/*.toml"))
          assert skills == commands, f"skills and Gemini commands differ: {skills} vs {commands}"
          try:
              import tomllib
              for p in glob.glob("commands/git-parity/*.toml"):
                  tomllib.load(open(p, "rb"))
          except ModuleNotFoundError:
              pass
          print("manifests ok:", versions.pop(), len(skills), "skills")
          PY

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: shellcheck scripts/git-parity.sh tests/run.sh
