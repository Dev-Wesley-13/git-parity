description = "List merged branches and stale worktree records; delete only what is approved."
prompt = """
Nothing was deleted yet. Show the report below grouped as it is. Present it in the user's language; keep repository names, branch names, states and commands verbatim. Ask what to delete, one decision per repository and group, and run exactly the printed command for each approval. Never delete anything listed as not verified, the current branch, the base branch or a remote branch. If the output ends with a "Setup" section or a "Note:" about the current repository, tell the user which groups were detected, ask about anything under "Ask the user about", and ask once whether to save; on a yes run the printed add command(s) exactly.

!{bash ~/.gemini/extensions/git-parity/scripts/git-parity.sh cleanup {{args}}}
"""
