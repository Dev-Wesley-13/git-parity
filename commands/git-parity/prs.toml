description = "My open pull/merge requests and the ones waiting for my review."
prompt = """
Show the report below as is with one sentence of summary. Present it in the user's language; keep repository names, branch names, states and commands verbatim. Do not merge, close, approve or comment on anything. If the output ends with a "Setup" section or a "Note:" about the current repository, tell the user which groups were detected, ask about anything under "Ask the user about", and ask once whether to save; on a yes run the printed add command(s) exactly.

!{bash ~/.gemini/extensions/git-parity/scripts/git-parity.sh prs {{args}}}
"""
