description = "Fast-forward local branches from their remotes, then report."
prompt = """
The report below was produced after fast-forwarding every branch that was strictly behind its remote. Show it as is and say how many repositories were updated and how many need the user. Present it in the user's language; keep repository names, branch names, states and commands verbatim. Never pull over uncommitted changes, stash, reset, rebase, switch branches, delete or push anything. A skipped repository is a correct outcome.

!{bash ~/.gemini/extensions/git-parity/scripts/git-parity.sh remote {{args}}}
"""
