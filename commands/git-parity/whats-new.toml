description = "What came into the base branch, and which of those files I also changed."
prompt = """
Do not paste the data below. Write a short briefing in the user's language: per repository, two to four bullets grouping the commits by theme; then call out every 'Also changed on your branch' line as a possible conflict; then one line listing repositories with nothing new. Use only what is in the data.

!{bash ~/.gemini/extensions/git-parity/scripts/git-parity.sh whats-new {{args}}}
"""
